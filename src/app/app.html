<mat-toolbar class="app-toolbar">
  <span>{{ title() }}</span>
  <nav class="nav">
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Home</a
    >
    <a mat-button routerLink="/accordion" routerLinkActive="active">Accordion</a>
  </nav>
  <span class="spacer"></span>
  <a
    mat-icon-button
    href="https://github.com/AmundOyen/angular-sandbox"
    target="_blank"
    rel="noopener"
    aria-label="View source on GitHub"
  >
    <mat-icon>code</mat-icon>
  </a>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
