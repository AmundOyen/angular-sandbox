<mat-toolbar class="app-toolbar">
  <span class="app-title">{{ title() }}</span>
  <span class="spacer"></span>
  <a
    mat-icon-button
    href="https://github.com/AmundOyen/angular-sandbox"
    target="_blank"
    rel="noopener"
    aria-label="View source on GitHub"
  >
    <mat-icon>code</mat-icon>
  </a>
</mat-toolbar>

<div class="shell">
  <dnd-navigator
    class="app-nav"
    aria-label="Main"
    [(items)]="navItems"
    [(expanded)]="navExpanded"
    [activeId]="activeId()"
    (itemSelect)="navigate($event)"
  />

  <main class="content">
    <router-outlet />
  </main>
</div>
