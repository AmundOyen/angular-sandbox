<mat-toolbar class="app-toolbar">
  <span class="app-title">{{ title() }}</span>
  <span class="spacer"></span>
  @let dark = colorScheme.scheme() === 'dark';
  <button
    mat-icon-button
    class="color-scheme-toggle"
    [attr.aria-label]="dark ? 'Switch to light mode' : 'Switch to dark mode'"
    [matTooltip]="dark ? 'Light mode' : 'Dark mode'"
    (click)="colorScheme.toggle()"
  >
    <mat-icon>{{ dark ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
  <a
    mat-icon-button
    href="https://github.com/AmundOyen/angular-sandbox"
    target="_blank"
    rel="noopener"
    aria-label="View source on GitHub"
  >
    <mat-icon>code</mat-icon>
  </a>
</mat-toolbar>

<div class="shell">
  <dnd-navigator
    class="app-nav"
    aria-label="Main"
    [(items)]="navItems"
    [(expanded)]="navExpanded"
    [activeId]="activeId()"
    (itemSelect)="navigate($event)"
  />

  <main class="content">
    <router-outlet />
  </main>
</div>
