<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AngularSandbox</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <script>
      // Apply a saved light/dark choice before the app starts, to avoid a flash of the other
      // scheme. Kept in sync with ColorSchemeService (src/app/color-scheme.ts).
      try {
        const scheme = localStorage.getItem('angular-sandbox.color-scheme');
        if (scheme === 'light' || scheme === 'dark') {
          document.documentElement.style.colorScheme = scheme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
